services:
  nextarget-staging-init:
    build: .
    # Named volumes created by an older image can retain root ownership. Repair
    # that local volume before the unprivileged runtime opens its SQLite file.
    user: "0:0"
    command: ["sh", "-c", "chown -R nextarget:nextarget /data"]
    volumes:
      - nextarget-staging-data:/data
    restart: "no"

  nextarget-staging:
    build:
      context: .
      args:
        NEXTARGET_SOURCE_REVISION: ${NEXTARGET_SOURCE_REVISION:-unknown}
    # The launcher supplies an absolute path when building from a temporary
    # worktree. Direct Compose use falls back to this repository's local file.
    env_file:
      - ${NEXTARGET_STAGING_ENV_FILE:-.env.staging}
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: sqlite:////data/nextarget-staging.db
      NEXTARGET_SOURCE_REVISION: ${NEXTARGET_SOURCE_REVISION:-unknown}
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - nextarget-staging-data:/data
    depends_on:
      nextarget-staging-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  nextarget-staging-data:
