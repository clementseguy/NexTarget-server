# Render.com Blueprint Configuration
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nextarget-api
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true  # Génère automatiquement un secret sécurisé
      - key: ACCESS_TOKEN_EXP_MINUTES
        value: 60
      # Database (NT-071): PostgreSQL on Neon (project nextarget-prod, Frankfurt).
      # DATABASE_URL = pooled connection, least-privilege runtime role
      # (e.g. nextarget_app). DATABASE_MIGRATION_URL = direct connection,
      # owner role (neondb_owner), used only by Alembic/pg_dump before
      # Uvicorn starts (see start.py). Both are set manually in the Render
      # Dashboard — never committed here, and never logged by the app.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      # CORS (NT-065): en production, aucune origine navigateur autorisée par
      # défaut (l'app mobile n'est pas concernée). Définir CORS_ALLOW_ORIGINS
      # (liste séparée par des virgules) uniquement si un client web existe.
      # Google OAuth - À configurer manuellement dans Render Dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false  # Doit être défini manuellement
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Facebook OAuth - À configurer manuellement dans Render Dashboard
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_REDIRECT_URI
        sync: false
      # Coach IA - Mistral (proxy /coach/analyze-session) - clé à définir manuellement
      - key: MISTRAL_API_KEY
        sync: false  # Doit être défini manuellement (ne jamais commiter la clé)
      - key: MISTRAL_API_BASE
        value: https://api.mistral.ai/v1
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      # Administration read-only (NT-049). Définir les deux valeurs à la main.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false  # Empreinte scrypt uniquement, jamais le mot de passe brut
